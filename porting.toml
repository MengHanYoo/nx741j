  "Build logs under out/nx741j/ios-16.7.16-20H392/nx741j/logs and the XNU compile records",
  "Stock boot backups and the Android root dd path as the recovery route",
]
configuration = [
  "kernel_args -v serial=3 in the payload; firmware menu holds the log pages",
  "AdvancedLogDxe packed with the Advanced Logger buffer (256 pages), PcdUniXNUDeviceModel = NX741J for the export filename, and payload [payload] tools = true so the Tools menu exists",
]
procedure = [
  "build with EXTRA_MAKE_ARGS=-O so parallel make output stays grouped per target",
  "on failure grep the log for ': error:' with the target name, then reproduce single-threaded",
  "recover the device by flashing the stock boot image through Android root dd and comparing SHA-256",
]
findings = [
  "Without -O the parallel log interleaves and hides error lines; that is what made the bsd failure look silent.",
  "Old objects and work trees survive pin changes: .cache/libpthread-work and build/xnu/ios-obj must be removed when a source pin changes.",
  "The 9008 path needs a ZTE-signed programmer for program commands; the official rescue package carries it, and power commands work with the generic one.",
]
completion = [
  "Every failed stage leaves a log with the failing target and a reproducible command",
  "Recovery from a bad boot image restores a booting device",
]
