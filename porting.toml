# ---------------------------------------------------------------------------
# firmware
# ---------------------------------------------------------------------------
[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = [
  "board.toml",
  "proprietary-files.txt",
  "docs/FIRMWARE-DRIVERS.md",
  "docs/PORTING-RECORD.md",
  "package/firmware-overlay/**",
]
inputs = [
  "Stock backup ZTEToolBoxParBak_2026.10.24: XBL/ABL, tz, aop, modem, uefi_a and device build strings",
  "Firmware volume window 0xFF300000 / 0x400000 and DXE heap 0xB00F0000 / 0x131A0000",
  "Board device tree carried inside the FV as FdtBlob (ABL rejects a tree appended to the boot kernel)",
  "Vendor UEFI tree uefi-nx741j with Mu-Silicium DXE chain and the board drivers",
]
configuration = [
  "board.toml [firmware]: dsc = Platforms/ZTE/nx741jPkg/nx741j.dsc, fd = Build/nx741jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd",
  "DSC [Components] lists UniXNUPkg/Application/UniXNU, UniXNUPkg/Driver/UniXNUDxe and UniXNUPkg/Driver/UniXNURamDiskDxe",
  "FDF [FV.FvMain] now packs UniXNURamDiskDxe directly after UniXNUDxe (Depex TRUE, produces BlockIo and DevicePath)",
  "APRIORI.inc and DXE.inc already provide DiskIoDxe and FatPkg EnhancedFat for the payload filesystem",
]
procedure = [
  "./unixnu build firmware -D ../UniXNU-nx741j   (UEFI tree from unixnu.local.toml [build] uefi)",
  "flash the resulting FD through a boot image or the EDL path",
  "inspect the FV with the firmware build log and the FFS directory under Build/nx741jPkg",
]
findings = [
  "Stage 2 is complete on device: the minimal 32-driver FV reaches BDS, UniXNUDxe registers its Boot#### option and the menu lists the NX741J payload entry.",
  "APRIORI DXE { INF ... } only sets dispatch precedence and does not add a file to the FV; UniXNURamDiskDxe and the board probe had to be listed in DXE.inc as well before they appeared in FVMAIN.inf.",
  "UniXNURamDiskDxe publishes the loader initrd from the x0 entry-argument HOB: the device log shows 'initrd block device 0xDFF7000 size 0x4000000 Success' followed by 'Installed Fat filesystem'.",
  "BdsDxe warns 'Connect ConIn failed - Not Found' because the minimal FV has no input device; the official fallback_timeout path still boots the default entry.",
  "Booting the payload entry produces a black screen followed by ZTE MemoryDump Mode, i.e. the failure is before any kernel output; panic_screen was enabled without a visible panic.",
  "board.toml changed in this range: [payload.adt] platform inputs and the trusted cache list are now explicit; the firmware layered behavior itself is unchanged.",
  "device-verified evidence for this area predates the menu-run regression: layer 1/2 checks pass, but layer 3/4 (menu to DarwinBoot) currently ends in ZTE MemoryDump mode, so the level must be re-validated on the next successful boot.",
  "Layer 4 remains blocked: the menu countdown ends in MemoryDump and the DARWINBOOT Boot called line never appears (docs/OPEN-ITEMS.md item 2).",
  "V67 regression: UniXNUDxe writes no Boot#### (the BDS never loads UniXNU) and the TLMM key probe faults; V68 adds a direct-start fallback and removes the keys driver from the FV. Current firmware is implemented, not device-verified for the menu path.",
]
completion = [
  "SILICIUM_UEFI.fd builds and contains UniXNU, DarwinBoot, the ramdisk block driver and the log exporter",
  "firmware reaches the UniXNU menu, the payload volume is visible as a block device, and Tools -> Advanced Logger exports the log as QR frames",
]
limits = [
  "Stage 4 (DarwinBoot -> XNU) is not passing: the payload entry ends in a black screen and MemoryDump before kernel output",
  "The UEFI keyboard/keypad path is unsolved: vendor PmicDxeLa asserts in pm_rpmh.c:659 because RPMH->RSC/SCM is absent, and ScmDxeCompat is the same binary as TzDxeLA",
  "The DTBExtnProtocol provider does not exist anywhere in Binaries/nx741j, so every DAL/PMIC consumer that needs it is limited",
]
next_action = [
  "Add logging around the EFI_DARWIN_BOOT_REQUEST build, the ADT parse and the Mach-O verification to find the last step before the black screen",
  "Read the V41 read-only probe output for TLMM pins 101/179/95 and decide between a hardcoded mapping and a page-table change",
  "Flash the V68 FD (c7cafaa6) with payload 7ac7776f, confirm UniXNUDxe direct-start reaches the UniXNU menu, then re-record the device evidence.",
]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "Firmware files and their stock backup sources" },
  { kind = "source", reference = "docs/FIRMWARE-DRIVERS.md", result = "SmemStubDxe and KernelStubDxe responsibilities in the DXE chain" },
  { kind = "source", reference = "docs/PORTING-RECORD.md", result = "Section 18 DXE bring-up notes and memory map" },
  { kind = "device", reference = "docs/STAGE2-CONFORMANCE.md", result = "UniXNU menu with the NX741J entry; ramdisk block device and FAT mount in the firmware log", command = "flash FD to rawdump LBA 4760360 (LUN0) and efisp loader, boot, capture the panel log", revision = "f2584c81ca5ddcf3c9e58a6d15b6866e85e11f85" },
  { kind = "device", reference = "docs/ANALYSIS-EFISP-VENDORBOOT.md", result = "PmicDxeLa assert pm_rpmh.c:659 and the TzDxeLA/ScmDxeCompat identity", command = "flash V39c FD, boot, capture the DXE log", revision = "f2584c81ca5ddcf3c9e58a6d15b6866e85e11f85" },
  { kind = "source", reference = "package/firmware-overlay/README.md", result = "Board DSC/FDF/APRIORI/DXE and drivers are applied by scripts/apply-firmware-overlay.py before ./unixnu build firmware" },
]

