schema_version = 1

[device]
name = "nx741j"
soc = "SM8850"
os_profile = "ios-16.7.16-20H392"
summary = "Nubia Z80 Ultra (NX741J), Qualcomm SM8850 / Kaanapali (canoe), 8 cores (6+2), Adreno 840, UFS KLUGG8NHKB, panel bf375/rm692h5. Target is iOS 16.7.16 (20H392) with XNU 8796.141.3, arm64, 4 KiB pages."

# ---------------------------------------------------------------------------
# configuration
# ---------------------------------------------------------------------------
[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/nx741j_defconfig", ".github/workflows/**"]
inputs = [
  "SoC SM8850 (Kaanapali, codename canoe): 8 cores in a 6+2 layout, GICv3, 4 KiB pages",
  "iOS 16.7.16 (20H392) is the only IPSW available for this device, so the target is fixed at xnu 8796.141.3",
  "UniXNU profile pair: profiles/arch/arm64 with profiles/os/ios-16.7.16-20H392",
  "Shared SoC support in UniXNU-sm8850-common (soc.toml, dtsi, configs, XNU series)",
]
configuration = [
  "board.toml: soc = \"SM8850\", soc_source = \"sm8850\", os_profile = \"ios-16.7.16-20H392\", kit = \"nx741j\"",
  "board.toml [components]: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink, DarwinBoot, GopFramebuffer (the resolver adds no further dependencies for this set)",
  "configs/nx741j_defconfig: CONFIG_XNU_SOURCE_CORECRYPTO14/PTHREAD, ARM_DT_PLATFORM, ARMCPU, CRYPTO_BOOTSTRAP=prelinked; native UFS and Adreno disabled",
  "unixnu.lock pins xnu 1b191cb5, libpthread cf9e1c7e (486.100.11), sm8850 825a5304 and the Apple reference sources",
]
procedure = [
  "cd UniXNU && ./unixnu defconfig nx741j_defconfig -D ../UniXNU-nx741j",
  "./unixnu fetch -D ../UniXNU-nx741j",
  "./unixnu status --json -D ../UniXNU-nx741j",
  "./unixnu tree -D ../UniXNU-nx741j",
]
findings = [
  "The arch profile's [kernel].archives lists component:SoftwareAES, so the board has to select that component or the archive plan aborts with 'component SoftwareAES is not selected'.",
  "A local sm8850 override in local.toml keeps the source unpinned and makes status report 'not reproducible'; the repository is mirrored into the host source cache and fetched through feeds.toml instead.",
  "The libpthread reference must match the 8796 kernel generation: 519.120.4 calls proc_get_jit_entitled, which 8796's pthread_callbacks_s does not define.",
]
completion = [
  "status --json resolves device, OS profile, configuration, module sources and output directory",
  "unixnu.lock pins every source, including the SoC repository",
  "status reports no 'not reproducible' source",
]
limits = [
  "Only the ios-16.7.16-20H392 profile is qualified; no second OS profile is maintained",
  "porting.toml follows the record format; board.toml keeps the schema 2 device configuration",
]
next_action = [
  "Re-run status --json after every board.toml or feed edit and commit unixnu.lock with the change",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board, component, kernel, firmware, payload and boot image inputs" },
  { kind = "source", reference = "unixnu.lock", result = "Resolved source commits including sm8850 825a5304 and libpthread cf9e1c7e" },
  { kind = "source", reference = "configs/nx741j_defconfig", result = "Kernel CONFIG_XNU_* values consumed by the kernel build script" },
]

# ---------------------------------------------------------------------------
# firmware
# ---------------------------------------------------------------------------
[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["board.toml", "proprietary-files.txt", "docs/FIRMWARE-DRIVERS.md", "docs/PORTING-RECORD.md"]
inputs = [
  "Stock backup ZTEToolBoxParBak_2026.10.24: XBL/ABL, tz, aop, modem, uefi_a and device build strings",
  "Firmware volume window 0xFF300000 / 0x400000 and DXE heap 0xB00F0000 / 0x131A0000",
  "Board device tree carried inside the FV as FdtBlob (ABL rejects a tree appended to the boot kernel)",
  "Vendor UEFI tree uefi-nx741j with Mu-Silicium DXE chain and the board drivers",
]
configuration = [
  "board.toml [firmware]: dsc = Platforms/ZTE/nx741jPkg/nx741j.dsc, fd = Build/nx741jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd",
  "DSC [Components] lists UniXNUPkg/Application/UniXNU, UniXNUPkg/Driver/UniXNUDxe and UniXNUPkg/Driver/UniXNURamDiskDxe",
  "FDF [FV.FvMain] now packs UniXNURamDiskDxe directly after UniXNUDxe (Depex TRUE, produces BlockIo and DevicePath)",
  "APRIORI.inc and DXE.inc already provide DiskIoDxe and FatPkg EnhancedFat for the payload filesystem",
]
procedure = [
  "./unixnu build firmware -D ../UniXNU-nx741j   (UEFI tree from unixnu.local.toml [build] uefi)",
  "flash the resulting FD through a boot image or the EDL path",
  "inspect the FV with the firmware build log and the FFS directory under Build/nx741jPkg",
]
findings = [
  "UniXNURamDiskDxe was listed in the DSC but missing from the FDF, so the payload volume never got a block device; the FDF entry was added and the firmware rebuilds with it.",
  "AdvancedLogDxe is packed: the DSC maps AssertLib, AdvancedLoggerAccessLib, AdvancedLoggerHdwPortLib and QrEncoderLib plus DebugLib=BaseDebugLibAdvancedLogger, and the FDF carries the driver, so Tools -> Advanced Logger pages the firmware log as QR frames.",
  "The SEC phase keeps BaseDebugLibSerialPort because SiliciumPkg/Sec/Sec.c calls BaseDebugLibSerialPortConstructor() directly; PEI and DXE use the Advanced Logger, which mirrors to the same SerialPortLib so the panel still shows the log.",
  "The layer 1 boot image that reached the panel carried firmware volume 2f8bc430; the later build db122c8a did not come up, so the FD version is a variable that has to be bisected. The current build is 7d820bcb.",
]
completion = [
  "SILICIUM_UEFI.fd builds and contains UniXNU, DarwinBoot, the ramdisk block driver and the log exporter",
  "firmware reaches the UniXNU menu, the payload volume is visible as a block device, and Tools -> Advanced Logger exports the log as QR frames",
]
limits = [
  "Layer 2 stops at RpmhDxe FAR=0x58 and a TzDxeLA assertion: SMEM contents, the DTB extension and tzapps are missing ABL environment inputs",
  "SMEM reads back as zeros, so the DXE chain cannot be validated past the RPMh stage",
]
next_action = [
  "Rebuild the FD with UniXNURamDiskDxe, flash the layer 1 image and capture the menu log; then bisect the FD build between 2f8bc430 and db122c8a",
]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "Firmware files and their stock backup sources" },
  { kind = "source", reference = "docs/FIRMWARE-DRIVERS.md", result = "SmemStubDxe and KernelStubDxe responsibilities in the DXE chain" },
  { kind = "source", reference = "docs/PORTING-RECORD.md", result = "Section 18 DXE bring-up notes and memory map" },
]

