]
procedure = [
  "add a Synaptics TCM protocol driver on top of QcomGeniSpi and register it with ShengHidInput",
  "verify pointer events in the menu and in the kernel",
]
findings = [
  "Stock DTS maps the keys to TLMM: VOL+ = gpio 101 (active low, pull-up), FOCUS = gpio 179, SHOOT = gpio 95; VOL- is the PMIC pmk8350-pon resin line.",
