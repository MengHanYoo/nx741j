  "read the live FDT on the device and reconcile every reserved-memory node",
  "build the payload so the ADT carries the memory map, then inspect payload.json",
]
findings = [
  "SMEM is set up by XBL before ABL runs, so a firmware path that runs before XBL initialization reads zeros; this is the open layer 2 input.",
  "The FD is mapped at 0xFF300000 and the framebuffer region at 0xFC800000; both must not overlap the DXE heap.",
]
completion = [
  "All handoff regions are accounted for and the kernel memory map matches the reserved set",
