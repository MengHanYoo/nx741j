paths = ["dts/board.dts", "board.toml", "configs/nx741j_defconfig"]
inputs = [
  "8 cores in two clusters: cluster0 cpu@0..500 (6 cores), cluster1 cpu@10000,10100 (2 cores)",
  "MIDR 0x51 / 0x002 (Qualcomm Oryon) on all cores, read from the running device",
  "Max frequencies 3.63 GHz (policy0) and 4.61 GHz (policy6) from cpufreq",
  "GICv3 distributor and redistributors, ARM generic timer",
]
configuration = [
  "dts/board.dts carries the cpu nodes, cpu-map and the mpidr values from the stock DT",
  "capacity-dmips-mhz 1792/1894 and dynamic-power-coefficient 238/588 from the stock DT",
  "configs/nx741j_defconfig enables CONFIG_XNU_ARMCPU",
]
procedure = [
  "compile the board DTS through ./unixnu build payload (ADT generation)",
  "build the kernel with ./unixnu build kernel and check the arch timer patch in the series",
]
findings = [
  "The stock DT has no CPU frequency table and no MIDR; both had to be read from the running Android system.",
  "L2 cache is per-core on cluster0 and shared through phandle 0x0e on cluster1.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and local timer interrupts fire on each CPU",
  "IPI delivery works between the two clusters",
]
limits = [
  "No on-device checkpoint has been reached yet; the kernel has only been built and linked",
]
next_action = [
  "Boot the kernel and record the per-CPU entry checkpoints in the diagnostics log",
]
