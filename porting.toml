# ---------------------------------------------------------------------------
# storage
# ---------------------------------------------------------------------------
[[area]]
id = "storage"
status = "planned"
components = [
  "ShengUfs",
  "VirtioMmioBlock",
  "VerifiedRoot",
]
paths = ["board.toml", "docs/PORTING-RECORD.md"]
inputs = [
  "UFS model KLUGG8NHKB-F0H1, vendor Samsung, revision 0500, boot LUN 4",
  "GPT entries: boot_a 119078, uefi_a 6, efisp 748894, vbmeta_a 143706, vendor_boot_a 302310",
  "boot_a is 96 MiB (100663296 bytes)",
  "Payload volume 64 MiB and the efisp / userdata fallbacks",
  "Boot device is soc/1d84000.ufshc with PHY 1d80000.ufsphy_mem; UFS part KLUGG8NHKB per the stock record.",
  "dumpsys diskstats reports about 975,850,316 KiB usable (1 TB part); the exact UFS model string is hidden from the shell.",
  "vendor_boot ramdisk provides gcc-canoe.ko (per-branch UFS offsets), phy-qcom-ufs-qmp-v4-canoe.ko, ufs-qcom.ko and ufshcd-crypto-qti.ko; the canoe UFS branch offsets differ from SM8550 except GDSCR and AXI.",
  "UFS part is SAMSUNG KLUGG8NHKB-F0H1 firmware 0500, 0xED4F800 logical blocks (~1 TB), LUN enable mask 0x3f (fh_loader getstorageinfo).",
  "board.toml [userdata] is filled from the dumped LUN0 GPT: first_lba 4875048, last_lba 248838138, lba_bytes 4096.",
]
configuration = [
  "board.toml [hardware.storage] records the UFS identity and the partition LBAs",
  "board.toml [payload] size_mib = 64 and [partition_strategy] primary = efisp, fallback = userdata FAT",
]
procedure = [
  "read the GPT from the running device and confirm each LBA",
  "write and read back a boot image through the Android root path (dd to /dev/block/by-name/boot_a) and compare SHA-256",
]
findings = [
  "UFS is not required for the official stage 2 path: the payload volume is a RAM initrd published by UniXNURamDiskDxe, and DiskIoDxe/Fat mount it successfully on device.",
  "The vendor UFS stack cannot run in this firmware because HALIOMMU needs DTBExtnProtocol and UFSDxe needs the RPMH/SCM chain; both providers are absent.",
  "board.toml changed in this range: the platform ADT inputs (psci_method/dram_size/owned_memory_size/cpu_regs) and the payload trust cache list were made explicit; see docs/STEP6-PLATFORM.md.",
  "ShengUfs is selected and links; the ADT now exports /arm-io/ufshc and the UFS GCC offsets are the measured canoe values. Runtime stays fail-closed because no verified-root policy bundle is compiled in.",
]
completion = [
  "SCSI capacity, GPT and known blocks read correctly",
  "The configured volume mounts and launchd starts; writes survive reboot",
]
limits = [
  "No Mu-side UFS BlockIo: UFSDxe/HALIOMMU cannot be enabled without DTBExtn, NPA and RPMH providers",
  "No XNU UFS driver yet: ShengUfs targets SM8550 and needs an SM8850 clock/reset table plus ArmSmmu4K",
  "ShengUfs link needs build-boot-progress.py plus storage policy/VerifiedRoot archives; the upstream public script depends on private kits/sheng sources and build-sheng-source-storage.py is not published (404).",
]
next_action = [
  "Keep the payload-volume path for stage 2/3 verification and revisit UFS only for the root volume after stage 4 passes",
  "Read the UFS model through fh_loader --getstorageinfo in 9008 (or root sysfs) and record it here.",
  "Generate the iOS 16 storage policy bundle (or port source-storage-runtime.patch to xnu-8796) to replace the empty verified-root policy table, then flash and verify capacity/GPT/mount.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "hardware.storage LBAs, UFS model and payload size" },
  { kind = "source", reference = "docs/PORTING-RECORD.md", result = "GPT inventory and partition strategy" },
  { kind = "device", reference = "docs/STAGE2-CONFORMANCE.md", result = "Payload volume mounted from the initrd (Fat) without any UFS BlockIo", command = "boot the minimal FV and read the UNIXNURAMDISK/Fat lines", revision = "f2584c81ca5ddcf3c9e58a6d15b6866e85e11f85" },
  { kind = "source", reference = "docs/STEP6-UFS.md", result = "UFS controller/PHY/GCC/SMMU checklist read from the device live DTB; ShengUfs SM8550 constants differ" },
]

