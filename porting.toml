  "Synaptics TCM touch on SPI, reset GPIO <0x33 0x42 0x00>, input device synaptics_tcm_touch",
  "Goodix fingerprint as a separate input device",
  "Buttons through ButtonsDxe in the firmware tree",
  "Touch is a Synaptics TCM device (synaptics_tcm_touch, 10 slots, ABS_X 0-12159 / ABS_Y 0-26879); fingerprint goodix_fp and proximity vi530x are separate input nodes (adb shell getevent -pl).",
  "Synaptics TCM firmware file names sdc_code_tcm.bin and sdc_data_tcm.bin appear in the modem image strings but are not present in its FAT tree; they must be extracted from the vendor image.",
