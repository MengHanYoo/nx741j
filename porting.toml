# ---------------------------------------------------------------------------
# packaging
# ---------------------------------------------------------------------------
[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink"]
paths = ["scripts/package.sh", "board.toml", "docs/HANDOFF-2026-11-07.md"]
inputs = [
  "Self-built XNU kernel (8796.141.3) and the original kernelcache matching the profile pin (2ec297ba)",
  "Trust cache bundle from the IPSW, chip id 207 and a non-zero unique chip id",
  "Boot image inputs: FD, compiled board DTB, payload volume 64 MiB, kernel args -v serial=3",
  "xnu 1b191cb5 with the 63-patch series, including the two XnuPrelink kit patches",
]
configuration = [
  "board.toml [kernel.prelink]: kernel = build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837, roots AppleARMPlatform + apfs, early_security_init empty",
  "board.toml [payload]: volume NX741J, 64 MiB, loader firmware, kernel_args [\"-v\", \"serial=3\"], two accepted trust cache hashes",
  "board.toml [bootimg.image]: base 0x80000000, kernel_offset 0x8000, tags_offset 0x1e00000, pagesize 4096, header_version 4 (TOML integers)",
  "scripts/package.sh runs deps, preflight, patches, build, pack and verify and writes package.manifest.json",
]
procedure = [
  "./unixnu build kernel -D ../UniXNU-nx741j",
  "./unixnu build payload -D ../UniXNU-nx741j",
  "./unixnu bootimg -D ../UniXNU-nx741j --ramdisk <payload.img>",
  "./scripts/package.sh --no-deps",
]
findings = [
  "unixnu build kernel exits 0 from a freshly cloned tree with all 63 patches applied: 856 compile records, eight archive builders, link and prelink.",
  "kernel.macho is 51,691,520 bytes and the prelink report lists 11 components with 23,833 bindings, but abi_qualified and runtime_qualified are both false, so it is an experimental candidate.",
  'The bootimg values must be TOML integers; quoted hex strings fail in verify with a TypeError, and local.toml ramdisk="none" silently drops the payload.',
  "The 1.37 MB boot image written to boot_a reads back bit-identical, but the firmware volume it carries (db122c8a) did not reach the menu, while the earlier 2f8bc430 image did.",
]
completion = [
  "package.sh produces kernel.macho, payload.img, boot.img and package.manifest.json with matching hashes",
  "The image boots the firmware menu on the device",
]
limits = [
  "early_security_init is empty, so AMFI does not run its early initializer",
  "runtime_qualified is false; the prelink has not been validated on hardware",
  "mockfs is disabled because this snapshot cannot produce the compile records its fixture builder reads",
]
next_action = [
  "Rebuild the boot image with the known-good firmware volume and bisect the FD regression",
]
evidence = [
  { kind = "host", reference = "docs/HANDOFF-2026-11-07.md", command = "EXTRA_MAKE_ARGS=-O ./unixnu build kernel -D ../UniXNU-nx741j", result = "Build exits 0 from a fresh clone with 63 patches, 856 compile records and a 51,691,520-byte kernel.macho", revision = "32b9855fb815cf2f33f845578a622ab0b6704b72" },
  { kind = "host", reference = "scripts/package.sh", command = "./scripts/package.sh --no-deps", result = "Steps preflight, patches, build, pack and verify pass and package.manifest.json is written", revision = "32b9855fb815cf2f33f845578a622ab0b6704b72" },
  { kind = "source", reference = "board.toml", result = "Prelink, payload and boot image inputs" },
]

# ---------------------------------------------------------------------------
# diagnostics
# ---------------------------------------------------------------------------
[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["docs/HANDOFF-2026-11-07.md", "docs/HANDOFF-2026-11-06.md", "docs/TASKS.md"]
inputs = [
  "Firmware output goes to the panel through FrameBufferSerialPortLib because the Android kernel disables the serial console (console=ttynull, geni_serial.con_enabled=0)",
  "Build logs under out/nx741j/ios-16.7.16-20H392/nx741j/logs and the XNU compile records",
  "Stock boot backups and the Android root dd path as the recovery route",
]
configuration = [
  "kernel_args -v serial=3 in the payload; firmware menu holds the log pages",
  "AdvancedLogDxe packed with the Advanced Logger buffer (256 pages), PcdUniXNUDeviceModel = NX741J for the export filename, and payload [payload] tools = true so the Tools menu exists",
]
procedure = [
  "build with EXTRA_MAKE_ARGS=-O so parallel make output stays grouped per target",
  "on failure grep the log for ': error:' with the target name, then reproduce single-threaded",
  "recover the device by flashing the stock boot image through Android root dd and comparing SHA-256",
]
findings = [
  "Without -O the parallel log interleaves and hides error lines; that is what made the bsd failure look silent.",
  "Old objects and work trees survive pin changes: .cache/libpthread-work and build/xnu/ios-obj must be removed when a source pin changes.",
  "The 9008 path needs a ZTE-signed programmer for program commands; the official rescue package carries it, and power commands work with the generic one.",
]
completion = [
  "Every failed stage leaves a log with the failing target and a reproducible command",
  "Recovery from a bad boot image restores a booting device",
]
limits = [
  "The QR exporter has not been exercised on hardware yet; the first capture still has to be scanned with OneSend",
]
next_action = [
  "Flash the rebuilt image, open Tools -> Advanced Logger and scan the frames with OneSend before the kernel handoff",
]
evidence = [
  { kind = "source", reference = "docs/HANDOFF-2026-11-07.md", result = "Eight failure classes with root causes and the recovery procedure" },
]

