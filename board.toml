schema_version = 2

[board]
name = "nx741j"
soc = "SM8850"
soc_source = "sm8850"
os_profile = "ios-16.7.16-20H392"
description = "Nubia Z80 Ultra (NX741J), SM8850/alor"
kit = "nx741j"

[components]
# SoftwareAES：arch profile 的 [kernel].archives 里写了 component:SoftwareAES，
# 且 common.config 打开 CONFIG_XNU_NATIVE_AES，必须选中才能在归档阶段解析到它。
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "GopFramebuffer"]

[kernel]
defconfig = "nx741j_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8850.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[kernel.prelink]
# 板级只补 profile 里留作占位的输入：tool / kernelcache_sha256 / slide 来自 OS profile。
# 原生内核即本仓库自编的链接产物。
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
# 保留原始 kernelcache 中的组件树；匹配器再按依赖补全其余组件。
roots = ["com.apple.driver.AppleARMPlatform", "com.apple.filesystems.apfs"]
# 待定：本 kernelcache 中 AppleMobileFileIntegrity 早期初始化器的原始 VA。
# profile 的 REQUIRED_EARLY_SECURITY_INIT 占位会让 emit_prelink 解析失败，故显式置空跳过。
# 补上真实地址前，AMFI 不会执行早期初始化（见 docs/concepts/security.md）。
early_security_init = ""
# 注：原始 kernelcache 里的专有函数（如 _vfs_getvfs_with_vfsops）由 ag/ah 系列补丁在
# 原生内核里补齐，因此不需要 --allow-missing（且它只对 MH_FILESET 输入有效，本 kernelcache 不是）。

[device_tree]
source = "device:dts/board.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "nx741j"
dsc = "Platforms/ZTE/nx741jPkg/nx741j.dsc"
fd = "Build/nx741jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Mu_Basecore", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Platforms/ZTE", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "NX741J"
ENABLE_SECUREBOOT = "0"

[payload]
volume = "NX741J"
size_mib = 64
loader = "firmware"
title = "NX741J"
kernel_args = ["-v", "serial=3"]
timeout = 5
tools = false
panic_screen = false
# 来自 out/.../payload/payload.json（上一次 payload 构建记录）
trust_cache_sha256 = ["63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b",
                        "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"]

[payload.adt]
chip_id = "207"
unique_chip_id = "required"

[bootimg.image]
base = "0x80000000"
kernel_offset = "0x8000"
tags_offset = "0x1e00000"
pagesize = 4096
header_version = 4
# 本机 ABL 不接受 gzip 流之后追加 DTB，也不接受内置 ramdisk；由 pack.sh 保证 ramdisk=0
kernel_compression = "gzip"

# scripts/package.sh 读取：UniXNU 检出相对本仓库的路径，以及每个 OS profile 使用的 defconfig。
# 设备名、路径、尺寸、内核参数都不写进脚本。
[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-16.7.16-20H392" = "nx741j_defconfig"
