schema_version = 2

[board]
name = "nx741j"
soc = "SM8850"
soc_source = "sm8850"
os_profile = "ios-16.7.16-20H392"
description = "Nubia Z80 Ultra (NX741J), SM8850 canoe (Kaanapali)"
kit = "nx741j"

[components]
# SoftwareAES 暂时不选：内核里 NativeAES 与预链接的 IOAESAccelerator 重复，
# 实测在 NativeAES::alloc -> IOAESAccelerator ctor 处以 instr=0 崩（未定义指令）。
# 先只用预链接提供者，等安全栈接好再决定归属。
# 原注释：arch profile 的 [kernel].archives 里写了 component:SoftwareAES，
# 且 common.config 打开 CONFIG_XNU_NATIVE_AES，必须选中才能在归档阶段解析到它。
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "ShengUfs", "VirtioMmioBlock", "VerifiedRoot", "ArmSmmu4K"]

[kernel]
defconfig = "nx741j_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8850.config", "os:configs/ios.config"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:GopFramebuffer",
  "patch-native-ufs-cold-init.py",
  "component:ShengUfs",
  "component:VirtioMmioBlock",
  "build-storage-bringup.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[kernel.prelink]
# 板级只补 profile 里留作占位的输入：tool / kernelcache_sha256 / slide 来自 OS profile。
# 原生内核即本仓库自编的链接产物。
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837"
# 保留原始 kernelcache 中的组件树；匹配器再按依赖补全其余组件。
# AppleARMPlatform 负责发布 CPU nub 和 /arm-io 的各子节点（官方第 5 阶段明确要求），
# 去掉它之后 IOKit 匹配会一直等待、无 panic 无输出。它当初的崩溃是写自己的 const
# 数据（pc 0x46DFDB4），已由 0008 关掉粒度权限收紧解决。
roots = ["com.apple.AGXFirmwareKextG10PRTBuddy", "com.apple.AGXFirmwareKextRTBuddy", "com.apple.AGXG10P", "com.apple.AUC", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AOPTouchKext", "com.apple.driver.AppleA7IOP", "com.apple.driver.AppleAD5860", "com.apple.driver.AppleAD81006", "com.apple.driver.AppleALSColorSensor", "com.apple.driver.AppleAOPVoiceTrigger", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAVE2", "com.apple.driver.AppleAcornDisplayPMU", "com.apple.driver.AppleActuatorDriver", "com.apple.driver.AppleAstrisGpioProbe", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleBSDKextStarter", "com.apple.driver.AppleBSDKextStarterTMPFS", "com.apple.driver.AppleBSDKextStarterVPN", "com.apple.driver.AppleBluetooth", "com.apple.driver.AppleBluetoothDebug", "com.apple.driver.AppleBluetoothDebugService", "com.apple.driver.AppleCS35L26Amp", "com.apple.driver.AppleCSEmbeddedAudio", "com.apple.driver.AppleDiagnosticDataAccessReadOnly", "com.apple.driver.AppleDiskImages2", "com.apple.driver.AppleEffaceableBlockDevice", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleEmbeddedAudio", "com.apple.driver.AppleEmbeddedAudioLibs", "com.apple.driver.AppleEmbeddedGPS", "com.apple.driver.AppleEmbeddedLightSensor", "com.apple.driver.AppleEmbeddedPCIE", "com.apple.driver.AppleEmbeddedTempSensor", "com.apple.driver.AppleEmbeddedTouchEEPROM", "com.apple.driver.AppleFAN53741", "com.apple.driver.AppleFirmwareUpdateKext", "com.apple.driver.AppleGPIOICController", "com.apple.driver.AppleGameControllerPersonality", "com.apple.driver.AppleH10CameraInterface", "com.apple.driver.AppleH10PearlCameraInterface", "com.apple.driver.AppleHIDKeyboard", "com.apple.driver.AppleHIDKeyboardEmbedded", "com.apple.driver.AppleHapticsSupportCallan", "com.apple.driver.AppleIDAMInterface", "com.apple.driver.AppleIDV", "com.apple.driver.AppleIISController", "com.apple.driver.AppleInputDeviceSupport", "com.apple.driver.AppleInterruptController", "com.apple.driver.AppleJPEGDriver", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleM68Buttons", "com.apple.driver.AppleMCA2-T8015", "com.apple.driver.AppleMobileApNonce", "com.apple.driver.AppleMobileDispH10P", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.AppleMonsoonErrorHandler", "com.apple.driver.AppleMultitouchDriver", "com.apple.driver.AppleMultitouchSPI", "com.apple.driver.AppleNANDConfigAccess", "com.apple.driver.ApplePMGR", "com.apple.driver.ApplePMP", "com.apple.driver.ApplePearlSEPDriver", "com.apple.driver.AppleProxDriver", "com.apple.driver.AppleS5L8920XPWM", "com.apple.driver.AppleS5L8940XI2C", "com.apple.driver.AppleS5L8960XNCO", "com.apple.driver.AppleS8000AES", "com.apple.driver.AppleS8000DWI", "com.apple.driver.AppleSEPCredentialManager", "com.apple.driver.AppleSEPKeyStore", "com.apple.driver.AppleSEPManager", "com.apple.driver.AppleSPMI", "com.apple.driver.AppleSPU", "com.apple.driver.AppleSPUSphere", "com.apple.driver.AppleSSE", "com.apple.driver.AppleSamsungSPI", "com.apple.driver.AppleSerialShim", "com.apple.driver.AppleSummitLCD", "com.apple.driver.AppleSynopsysMIPIDSI", "com.apple.driver.AppleT8010SOCTuner", "com.apple.driver.AppleT8015", "com.apple.driver.AppleT8015CLPCv3", "com.apple.driver.AppleT8015DART", "com.apple.driver.AppleT8015PCIe", "com.apple.driver.AppleT8015PMGR", "com.apple.driver.AppleT8015PMPFirmware", "com.apple.driver.AppleT8015PPM", "com.apple.driver.AppleT8015SmartIO", "com.apple.driver.AppleTopCaseActuatorHIDDriver", "com.apple.driver.AppleTopCaseDriverV2", "com.apple.driver.AppleTopCaseHIDEventDriver", "com.apple.driver.AppleUSBDeviceMux", "com.apple.driver.AppleUSBEthernetDevice", "com.apple.driver.AppleUSBHostMergeProperties", "com.apple.driver.AppleUSBMike", "com.apple.driver.BCMWLANFirmware4357.Hashstore", "com.apple.driver.DiskImages", "com.apple.driver.DiskImages.FileBackingStore", "com.apple.driver.DiskImages.KernelBacked", "com.apple.driver.DiskImages.RAMBackingStore", "com.apple.driver.DiskImages.ReadWriteDiskImage", "com.apple.driver.DiskImages.UDIFDiskImage", "com.apple.driver.IODARTFamily", "com.apple.driver.IOImageLoader", "com.apple.driver.IOSlaveProcessor", "com.apple.driver.RTBuddy", "com.apple.driver.USBStorageDeviceSpecifics", "com.apple.driver.corecapture", "com.apple.driver.mDNSOffloadUserClient-Embedded", "com.apple.driver.usb.AppleUSBCommon", "com.apple.filesystems.apfs", "com.apple.filesystems.hfs.kext", "com.apple.filesystems.lifs", "com.apple.filesystems.tmpfs", "com.apple.iokit.AppleARMIISAudio", "com.apple.iokit.AppleSEPGenericTransfer", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOBiometricFamily", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOHIDEventDriver", "com.apple.iokit.IOHIDEventDriverSafeBoot", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IONetworkingFamily", "com.apple.iokit.IOPCIFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSCSIArchitectureModelFamily", "com.apple.iokit.IOSCSIBlockCommandsDevice", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOStreamFamily", "com.apple.iokit.IOSurface", "com.apple.iokit.IOUSBDeviceFamily", "com.apple.iokit.IOUserEthernet", "com.apple.kec.Compression", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kec.pthread", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.nke.l2tp", "com.apple.nke.ppp", "com.apple.security.AppleImage4", "com.apple.security.sandbox"]
# 本配置的 roots 不含 AppleMobileFileIntegrity，prelink 报告 early_security_initializers={}，
# 因此显式置空以覆盖 profile 的 REQUIRED_EARLY_SECURITY_INIT 占位；接入 AMFI 时再填 identifier=address。
early_security_init = ""
# 注：原始 kernelcache 里的专有函数（如 _vfs_getvfs_with_vfsops）由 ag/ah 系列补丁在
# 原生内核里补齐，因此不需要 --allow-missing（且它只对 MH_FILESET 输入有效，本 kernelcache 不是）。


[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d221ap"
chip_id = 0x8015
board_id = 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache"]

[ipsw.sha256]
"kernelcache.release.iphone10b" = "2d6a13d040aaf87cec09bb6906d43e9bd8cea951e43d1aa1cd62707dfdc5aaec"
"Firmware/all_flash/DeviceTree.d221ap.im4p" = "889e838319619c10f5f7f6ef25f9ff2a3a652a3c078803038ba678efa1201b79"
"Firmware/087-86593-047.dmg.trustcache" = "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"
"Firmware/087-86698-044.dmg.trustcache" = "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b"

[device_tree]
# 实机 DTB（911 KB / 5,332 节点）派生的 ADT 源：由 scripts/mk-adt-dts.py 生成，
# 已就地补上 ADT 交接需要的四项归一（/memory 单段、/psci 提到根、/cpus 时基、
# 删除 cpu-map/idle-states）并按板级身份覆盖 model/compatible。
# 手写板级树 dts/nx741j.dts 仍保留，供固件 FdtBlob 与差异对照使用。
source = "device:dts/nx741j-adt.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "nx741j"
dsc = "Platforms/ZTE/nx741jPkg/nx741j.dsc"
fd = "Build/nx741jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["kits/nx741j/firmware-preflight.py"]
submodules = []
patches = []
packages = ["{uefi}", "{uefi}/Mu_Basecore", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Platforms/ZTE", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "NX741J"
ENABLE_SECUREBOOT = "0"

[bootimg]
# The payload step writes the compiled device tree to <work>/device-tree/hardware.dtb;
# the release pack step names it relative to the build tree.
dtb = "../device-tree/hardware.dtb"

[payload]
volume = "NX741J"
size_mib = 64
loader = "firmware"
title = "NX741J"
# 文档第 3 步：xnu 条目声明 dtb，UniXNU 才会走"复制树+64 KiB+补丁+chosen+EFI_DTB_TABLE"；
# "firmware" 取 FdtBlob 安装的固件树，不额外占用 payload 空间。
dtb = "firmware"
# 加载器（efisp loader + Mu SEC）交给内核的连续 RAM 范围。必须放在 [payload]：
# 格式 2 的 payload 走 devicetree.generate，它在 devicetree.py:306 读 payload.dram_size
# 与 DT /memory 比较，不一致就报 “payload.dram_size differs from the hardware DTS”；
# 格式 1 的 --dram-size 也取 spec["dram_size"]（payload.py:171）。
dram_size = "0x140000000"
# 阶段 5 已越过控制台（根因是 BCM2837 的 PLATFORM_PANIC_LOG_PADDR，见
# patches/xnu/0002-bcm2837-drop-panic-log-paddr.patch）。恢复真实面板帧缓冲：
# 彩带在 MMU 关闭时写物理地址 0xFC800000，内核在 initialize_screen 里自己映射。
# kextlog=0xffff：让 OSKext 把"正在启动哪个 kext"打到控制台（屏幕上能看见），
# 用来定位 loadSecurityExtensions 里第一个失败的 Apple kext。
# 去掉 debug=0x144：它让 panic() 进入内核调试器等待，屏幕不打印文本，随后硬件
# 看门狗把设备复位成 memorydump 模式。去掉后 panic 会直接把文本画到面板上。
# 去掉 serial=3：本机没有串口设备，带上它反而让控制台走串口分支，屏幕上收不到
# 内核 print。让它走视频控制台，配合 kextlog 就能在面板上看到内核输出。
# native-ufs-probe=10：只读自查（GPT → userdata → 首块），让 NativeUfs 绑定
# /arm-io/ufshc（IOPlatformDevice + IONameMatch），不写任何数据。
kernel_args = ["keepsyms=1", "kextlog=0x1", "native-ufs-probe=0", "native-ufs-diagnostics=0", "native-ufs-dma-offset=0", "native-ufs-cold-init=1"]
# 文档：panic 屏与入口探针不能同时启用；这里用探针二分 IOKit 初始化。
panic_screen = true
# panic 屏和 stage-4 复位代码洞放不下（0xa1f vs 剩余 0x970），二分阶段先关掉；
# 彩带仍随探针注入（stage 1/2 与复位洞穴是分开的）。
# machine_startup 不返回，所以复位点放在调用之前：看到复位 = 已经走到 IOKit 门口。
timeout = 5
rotate = 0
fallback_timeout = 10
connect_all = true
# Tools 菜单是固件日志导出的入口（Tools → Advanced Logger → 二维码页），
# 对应固件侧 AdvancedLogDxe 与 Advanced Logger 缓冲区。
tools = true
# 正式构建（无探针、panic_screen = true）用 scripts/probe-mode.py off 生成。
# DarwinBoot 的 ValidTrustCaches 要的是扁平 bundle（u32 计数 + 偏移表 + 以 2 开头的
# blob），而 IPSW 里是 DER/IM4P 容器：直接塞 IM4P 会在 [0l] tc in 之后被拒
# （EFI_COMPROMISED_DATA）。用 scripts/mk-trustcache-bundle.py 转换后再作为输入。
trust_cache_sha256 = ["29dcf050a9b35f91493a48a1344ef2199364f8c86e79000a46e833332eefae4f"]

[payload.ui]
title = "NX741J"
logo = true
layout = "auto"
scale = 0
portrait_below = 800
console = "auto"

[payload.adt]
chip_id = "207"
unique_chip_id = "required"
# 平台输入：SM8850 的 PSCI 走 SMC（dts sm8850.dtsi 的 /psci method = "smc"）。
psci_method = "smc"
owned_memory_size = "0x10000000"
# root_match_volume_uuid 仍未填：它必须是 OS 窗口卷的 UUID（/chosen/root-matching 用它选根卷），
# 只能从 ./unixnu userdata 产出的镜像里读，不能从 DTB 或 BuildManifest 推。阶段 6 生成镜像后补。
# 实机 DTB 的 /cpus 有 8 个节点，reg 依次为 (0,0) (0,0x100) (0,0x200) (0,0x300)
# (0,0x400) (0,0x500) (0,0x10000) (0,0x10100)。格式 2 的 ADT 生成器直接读 DT 的
# /cpus，不用这个键；它只在格式 1 的 --cpu-regs 路径生效，这里按实机值补全以免误导。
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x10000,0x10100"

[userdata]
# From the dumped LUN0 GPT (The device uses 4096-byte logical sectors):
# userdata starts at LBA 4875048 with 243963091 sectors.
first_lba = 4875048
last_lba = 248838138
lba_bytes = 4096
# 阶段 6：userdata 承载 Darwin 根文件系统，两个窗口按官方 concepts/userdata 定义。
# 组件名取自本机 IPSW 的 BuildManifest（iPhone10,3 / 20H392，Erase 身份）：
#   OS                -> 087-86698-044.dmg 4,730,814,044 B（4.40 GiB）
#   Cryptex1,SystemOS -> 087-86593-047.dmg 2,743,074,816 B（2.55 GiB）
# userdata 容量 243963091 * 4096 = 999,272,820,736 B（930.65 GiB），两个窗口装得下。
# ./unixnu userdata 会把这两个组件按字节复制进 SHNGROOT 镜像并写 userdata-root.json。

[[userdata.windows]]
name = "OS"
component = "OS"

[[userdata.windows]]
name = "SystemOS"
component = "Cryptex1,SystemOS"

[bootimg.image]
# 必须是 TOML 整数：unixnu 的 verify() 直接用这些值做整数加法（字符串会 TypeError）。
base = 0x80000000
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 4
# 本机 ABL 不接受 gzip 流之后追加 DTB，也不接受内置 ramdisk。
# unixnu bootimg 总会把 DTB 追加在 gzip 之后，因此标准产物需实机确认；
# 已验证的旧格式（boot-uefi-*.img）是 ramdisk=0，可用 --ramdisk none 生成对照镜像。

# scripts/package.sh 读取：UniXNU 检出相对本仓库的路径，以及每个 OS profile 使用的 defconfig。
# 设备名、路径、尺寸、内核参数都不写进脚本。
[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-16.7.16-20H392" = "nx741j_defconfig"
