# Device image run: one command from a clean checkout to boot.img + payload.img.
#
# The workflow only drives scripts/package.sh; board values stay in board.toml and local
# inputs come from repository secrets. See https://unixnu.com/zh/porting/packaging.
#
# Required secrets:
#   UNIXNU_CHECKOUT_TOKEN    read access to the private UniXNU and uefi-nx741j checkouts
#   UNIXNU_UNIQUE_CHIP_ID    the platform seed of this device (16 hex digits); the image
#                            embeds it and is valid for this device only
name: Device image

on:
  workflow_dispatch:
    inputs:
      os:
        description: OS profile (empty means board.toml [board] os_profile)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-nx741j

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: MengHanYoo/UniXNU-main-nx741j
          token: ${{ secrets.UNIXNU_CHECKOUT_TOKEN || github.token }}
          path: UniXNU

      - name: Check out the vendor UEFI tree
        uses: actions/checkout@v4
        with:
          repository: MengHanYoo/uefi-nx741j
          token: ${{ secrets.UNIXNU_CHECKOUT_TOKEN || github.token }}
          path: uefi-nx741j

      - name: Install host tools
        run: |
          brew install dtc cmake mtools llvm lld lzfse
          for tool in dtc cmake mcopy llvm-objcopy lld; do
            command -v "$tool" >/dev/null || { echo "missing $tool" >&2; exit 1; }
          done

      - name: Check the configuration and patch order
        working-directory: UniXNU-nx741j
        run: scripts/package.sh --check --os "${{ inputs.os }}"

      - name: Build and pack
        working-directory: UniXNU-nx741j
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-nx741j
        run: scripts/package.sh --os "${{ inputs.os }}"

      - name: Upload the image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nx741j-image
          path: |
            UniXNU/out/**/boot/boot.img
            UniXNU/out/**/payload/payload.img
            UniXNU/out/**/kernel/kernel.macho
            UniXNU/out/**/package.manifest.json
          if-no-files-found: error

      - name: Remove the run
        # The artifact is a boot image for one device; do not keep it around.
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run delete --repo "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
