version = 1
[boot]
timeout = 0
[[kit]]
path = "Kits/Test.kit"
[[driver]]
path = "XnuTest.efi"
args = "nullboot"
connect = false
[[entry]]
id = "xnu"
type = "xnu"
title = "Synthetic XNU request"
path = "synthetic-kernel"
args = "test handoff"
[[entry.kext]]
enabled = false
bundle = "Absent.kext"
[[entry.kext]]
bundle = "Kexts/Codeless.kext"
[[entry.kext]]
bundle = "Kexts/Code.kext"
executable = "Contents/MacOS/Test"
